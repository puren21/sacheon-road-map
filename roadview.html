<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사천시 도로현황 · 로드뷰</title>
  <style>
    html,body,#roadview{width:100%;height:100%;margin:0}
    #status{position:absolute;top:12px;left:12px;z-index:2;padding:9px 12px;border-radius:7px;background:#fff;color:#26313b;font:14px sans-serif;box-shadow:0 2px 10px #0003}
  </style>
</head>
<body>
  <div id="status">로드뷰를 불러오는 중입니다.</div>
  <div id="roadview"></div>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7ee4bab8cd4d6be6d0d68a49e9b4502b&autoload=false"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const lat = Number(params.get('lat'));
    const lng = Number(params.get('lng'));
    const status = document.getElementById('status');
    if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat)>90 || Math.abs(lng)>180) {
      status.textContent = '올바른 위치 좌표가 없습니다.';
    } else if (!window.kakao || !kakao.maps) {
      status.textContent = '카카오 로드뷰를 불러오지 못했습니다.';
    } else kakao.maps.load(function() {
      const position = new kakao.maps.LatLng(lat, lng);
      const viewer = new kakao.maps.Roadview(document.getElementById('roadview'));
      new kakao.maps.RoadviewClient().getNearestPanoId(position, 100, function(panoId) {
        if (panoId === null) {
          status.textContent = '이 위치 주변에 로드뷰가 없습니다.';
          return;
        }
        viewer.setPanoId(panoId, position);
        status.remove();
      });
    });
  </script>
</body>
</html>
